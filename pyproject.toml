[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name            = "jaxforge"
version         = "0.2.0"
description     = "Model-agnostic natural language engineering workbench for JAX and Flax"
readme          = "README.md"
license         = { file = "LICENSE" }
authors         = [{ name = "Wesley Kambale", email = "spartanwk@gmail.com" }]
requires-python = ">=3.10"
keywords        = ["jax", "flax", "equinox", "ai-agent", "machine-learning", "llm", "neural-networks"]
classifiers     = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.4.25",
    "flax>=0.9.0",
    "optax>=0.2.0",
    "orbax-checkpoint>=0.6.0",
    "numpy>=1.24.0",
]

[project.scripts]
jaxforge = "jaxforge.cli:main"

[project.optional-dependencies]
google      = ["google-genai>=1.0.0"]
openai      = ["openai>=1.50.0"]
anthropic   = ["anthropic>=0.40.0"]
litellm     = ["litellm>=1.50.0"]
equinox     = ["equinox>=0.11.0"]
grain       = ["grain>=0.2.0"]
safetensors = ["safetensors>=0.4.0"]
docker      = ["docker>=7.0.0"]
e2b         = ["e2b-code-interpreter>=1.0.0"]
modal       = ["modal>=0.64.0"]
mcp         = ["mcp>=1.0.0"]
viz         = ["matplotlib>=3.8"]
gpu         = ["jax[cuda12]"]
tpu         = ["jax[tpu]"]
dev         = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4.0", "mypy>=1.9.0", "pre-commit", "hatch"]
docs        = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24.0"]

[project.urls]
Homepage      = "https://github.com/wkambale/jaxforge"
Documentation = "https://wkambale.github.io/jaxforge"
Repository    = "https://github.com/wkambale/jaxforge"
Issues        = "https://github.com/wkambale/jaxforge/issues"
Changelog     = "https://github.com/wkambale/jaxforge/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/jaxforge", "src/jax_gemini"]

[tool.ruff]
target-version = "py310"
line-length    = 100
src            = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/jaxforge/sandbox/backends.py" = ["S102"]
"tests/*" = ["S101", "S105"]

[tool.mypy]
python_version         = "3.10"
strict                 = true
warn_return_any        = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath   = ["src"]
testpaths    = ["tests"]
addopts      = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source   = ["src/jaxforge"]
omit     = ["*/tests/*", "*/__init__.py", "src/jax_gemini/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
