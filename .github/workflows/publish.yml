name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release tag matches pyproject.toml version
        if: github.event_name == 'release'
        run: |
          python - <<'EOF'
          import os, tomllib
          with open("pyproject.toml", "rb") as f:
              pkg_version = tomllib.load(f)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if tag != pkg_version:
              raise SystemExit(
                  f"Release tag '{os.environ['GITHUB_REF_NAME']}' does not match "
                  f"pyproject.toml version '{pkg_version}'."
              )
          EOF

      - name: Install dependencies and verification tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz]" twine build

      - name: Run lint, type check, and tests
        run: |
          ruff check src tests examples
          mypy src
          pytest --cov=jaxforge tests/

      - name: Build sdist and wheel
        run: |
          rm -rf dist
          python -m build
          twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  publish-pypi:
    name: Publish package to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jaxforge
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI via Trusted Publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
