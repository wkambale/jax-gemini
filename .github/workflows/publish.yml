name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Verify release tag matches pyproject.toml version
        if: github.event_name == 'release'
        run: |
          python - <<'EOF'
          import os, tomllib
          with open("pyproject.toml", "rb") as f:
              pkg_version = tomllib.load(f)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if tag != pkg_version:
              raise SystemExit(
                  f"Release tag '{os.environ['GITHUB_REF_NAME']}' does not match "
                  f"pyproject.toml version '{pkg_version}'."
              )
          EOF

      - name: Install dependencies and verification tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz]" "build==1.6.1" "twine==7.0.0"

      - name: Run lint, type check, and tests
        run: |
          ruff check src tests examples
          mypy src
          pytest --cov=jaxforge tests/

      - name: Build sdist and wheel
        run: |
          rm -rf dist
          python -m build
          twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dists
          path: dist/

  publish-pypi:
    name: Publish package to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jaxforge
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI via Trusted Publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
